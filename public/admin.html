<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>比賽管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="/" style="color:inherit;text-decoration:none">🧗 攀岩比賽 · 管理</a>
      <nav>
        <a href="/">比賽列表</a>
        <a href="/admin" class="active">管理</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="card hidden" id="login-view">
      <h2>管理員登入</h2>
      <form id="login-form">
        <div class="grid">
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username">
          </div>
          <div>
            <label for="password">密碼</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>
        </div>
        <div class="actions"><button type="submit">登入</button></div>
        <div class="msg" id="login-msg"></div>
      </form>
    </section>

    <div class="hidden" id="admin-view">
      <div class="toolbar">
        <h1 style="margin:0">比賽管理</h1>
        <span class="spacer"></span>
        <button class="secondary" id="logout-btn">登出</button>
      </div>
      <p class="lead">此頁面可看到選手真實姓名與匯款資料，請勿外流。</p>

      <div class="admin-bar">
        <label for="comp-select" style="margin:0">目前比賽</label>
        <select id="comp-select"></select>
        <button class="secondary" id="new-comp-btn">＋ 新增比賽</button>
        <a class="btn secondary" id="view-comp-link" target="_blank">查看比賽頁 ↗</a>
      </div>
      <div class="msg" id="top-msg"></div>

      <!-- 比賽設定 -->
      <section class="card">
        <h2 id="comp-form-title">比賽設定</h2>
        <form id="comp-form">
          <div class="grid">
            <div><label for="c-title">比賽名稱</label><input id="c-title" required maxlength="80" placeholder="例：2026 春季抱石賽"></div>
            <div>
              <label for="c-slug">網址代碼 <span class="hint">（英文小寫、數字、-）</span></label>
              <input id="c-slug" required maxlength="50" pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?" placeholder="例：2026-spring">
              <div class="field-hint" id="c-slug-hint"></div>
            </div>
            <div><label for="c-date">比賽日期</label><input id="c-date" type="date"></div>
            <div><label for="c-location">地點</label><input id="c-location" maxlength="120"></div>
            <div><label for="c-fee">報名費（元） <span class="hint">（空白 = 未定）</span></label><input id="c-fee" type="number" min="0"></div>
          </div>
          <div class="check-row" style="margin-top:16px">
            <label><input type="checkbox" id="c-published"> 公開（出現在比賽列表）</label>
            <label><input type="checkbox" id="c-open" checked> 開放報名</label>
          </div>
          <div style="margin-top:16px">
            <label for="c-payment">匯款方式 <span class="hint">（選手填寫繳費資訊時會看到）</span></label>
            <textarea id="c-payment" maxlength="2000" placeholder="例：&#10;銀行：XX 銀行（代碼 000）&#10;帳號：0000-0000-0000&#10;戶名：XX 攀岩協會"></textarea>
          </div>
          <div style="margin-top:16px">
            <label for="c-brochure">簡章內容 <span class="hint">（支援 Markdown：# 標題、- 清單、**粗體**、[連結](https://...)）</span></label>
            <textarea id="c-brochure" class="tall" maxlength="50000"></textarea>
          </div>
          <div class="actions">
            <button type="submit" id="comp-save-btn">儲存比賽設定</button>
            <button type="button" class="secondary" id="brochure-preview-btn">預覽簡章</button>
            <span class="spacer" style="flex:1"></span>
            <button type="button" class="danger" id="comp-delete-btn">刪除比賽</button>
          </div>
          <div class="msg" id="comp-msg"></div>
          <div class="card hidden" id="brochure-preview" style="margin-top:16px"></div>
        </form>
      </section>

      <div id="comp-detail">
        <!-- 組別 -->
        <section class="card">
          <h2>組別設定</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>排序</th><th>組別名稱</th><th>說明</th><th>人數上限</th><th>開放報名</th><th>已報名</th><th></th></tr></thead>
              <tbody id="cat-list"></tbody>
            </table>
          </div>
          <h3 style="margin-top:24px">新增組別</h3>
          <form id="cat-form">
            <div class="grid">
              <div><label for="cat-name">組別名稱</label><input id="cat-name" required maxlength="40" placeholder="例：男子初階組"></div>
              <div><label for="cat-desc">說明 <span class="hint">（選填）</span></label><input id="cat-desc" maxlength="200" placeholder="例：攀爬經驗一年以下"></div>
              <div><label for="cat-cap">人數上限 <span class="hint">（空白 = 不限）</span></label><input id="cat-cap" type="number" min="1"></div>
              <div><label for="cat-sort">排序</label><input id="cat-sort" type="number" value="0"></div>
            </div>
            <div class="actions"><button type="submit">新增組別</button></div>
          </form>
          <div class="msg" id="cat-msg"></div>
        </section>

        <!-- 繳費審核 -->
        <section class="card">
          <h2>繳費審核 <span class="badge" id="pending-count"></span></h2>
          <div id="pending-list"></div>
          <div class="msg" id="pay-msg"></div>
        </section>

        <!-- 報名資料 -->
        <section class="card">
          <div class="toolbar">
            <h2 style="margin:0">報名資料</h2>
            <span class="spacer"></span>
            <button class="secondary" id="export-btn">匯出 CSV</button>
          </div>
          <div class="tabs" id="tabs"></div>
          <div class="toolbar">
            <input type="search" id="search" placeholder="搜尋姓名或團體">
            <select id="pay-filter" style="width:auto">
              <option value="">全部繳費狀態</option>
              <option value="unpaid">未繳費</option>
              <option value="pending">審核中</option>
              <option value="paid">已繳費</option>
            </select>
            <span class="spacer"></span>
            <span class="preview" id="total"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>真實姓名</th><th>公開顯示</th><th>組別</th><th>所屬團體</th><th>繳費</th><th>報名時間</th><th></th></tr></thead>
              <tbody id="reg-list"></tbody>
            </table>
          </div>
          <div class="msg" id="reg-msg"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- 繳費紀錄對話框 -->
  <dialog id="history-dialog">
    <div class="dlg-body">
      <div class="dlg-head">
        <h2 id="history-title">繳費紀錄</h2>
        <button type="button" class="close" id="history-close" aria-label="關閉">×</button>
      </div>
      <div id="history-list"></div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>

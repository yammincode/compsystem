[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  # SUPABASE_URL 與 anon/publishable key 本來就是公開值（會出現在前端），不需要被當成祕密掃描
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"

# 每場比賽的頁面：/c/<比賽代碼>、/c/<比賽代碼>/register ...
[[redirects]]
  from = "/c/*"
  to = "/competition.html"
  status = 200

# 第一版的成績頁網址
[[redirects]]
  from = "/results"
  to = "/"
  status = 301
